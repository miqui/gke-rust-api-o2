apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: message-service
  labels:
    app: message-service
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: message-service
  minReplicas: 3
  maxReplicas: 6
  # CPU only: the pod's memory is a small, nearly flat footprint, so a memory target would say
  # nothing about load.
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
