apiVersion: apps/v1
kind: Deployment
metadata:
  name: message-service
  labels:
    app: message-service
spec:
  replicas: 3
  selector:
    matchLabels:
      app: message-service
  template:
    metadata:
      labels:
        app: message-service
    spec:
      terminationGracePeriodSeconds: 45
      securityContext:
        # runAsUser is set explicitly as well as runAsNonRoot: 65532 is the numeric `nonroot`
        # uid/gid of the distroless runtime image (see the Dockerfile), which is what lets the
        # kubelet verify it's non-root. It is above 10000 so it can't collide with a host user
        # (Trivy KSV-0020/KSV-0021).
        # The container-level securityContexts below (no privilege escalation, no capabilities)
        # are what the Kyverno policies in k8s/policies/ require; readOnlyRootFilesystem is for
        # Trivy KSV-0014.
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: wait-for-postgres
          image: postgres:16-alpine
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: "10m"
              memory: "16Mi"
            limits:
              cpu: "100m"
              memory: "64Mi"
          envFrom:
            - configMapRef:
                name: message-service-config
            - secretRef:
                name: postgres-credentials
          env:
            # Cloud SQL private IP, from the Secret Crossplane writes for the PostgresInstance
            # (k8s/postgres.yaml). Until that exists the pod shows CreateContainerConfigError
            # and the kubelet keeps retrying.
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: cloudsql-connection
                  key: privateIP
          command:
            - sh
            - -c
            - |
              # Connect to the application database itself, not just the server: Cloud SQL accepts
              # connections (pg_isready passes) minutes before Crossplane has created the database
              # and user, and the app's startup migration would fail on "database does not exist".
              export PGPASSWORD="$DB_PASSWORD" PGSSLMODE="$DB_SSLMODE" PGCONNECT_TIMEOUT=3
              until psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_NAME" -tAc 'SELECT 1' >/dev/null 2>&1; do
                echo "Waiting for database $DB_NAME on Cloud SQL at $DB_HOST:$DB_PORT..."
                sleep 2
              done
        - name: wait-for-redis
          image: busybox:1.36
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: "10m"
              memory: "16Mi"
            limits:
              cpu: "100m"
              memory: "64Mi"
          envFrom:
            - configMapRef:
                name: message-service-config
          env:
            # Memorystore private IP, from the Secret Crossplane writes for the RedisInstance
            # (k8s/redis.yaml). Until that exists the pod shows CreateContainerConfigError and
            # the kubelet keeps retrying.
            - name: REDIS_HOST
              valueFrom:
                secretKeyRef:
                  name: redis-connection
                  key: host
          command:
            - sh
            - -c
            - |
              until nc -z -w 3 "$REDIS_HOST" "$REDIS_PORT"; do
                echo "Waiting for Memorystore at $REDIS_HOST:$REDIS_PORT..."
                sleep 2
              done
      containers:
        - name: message-service
          image: message-service:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          # The root filesystem is read-only; /tmp is the one writable path (scratch space).
          # redis-ca is Memorystore's server CA (from the Crossplane connection Secret), used to
          # verify the TLS connection (REDIS_CA_CERT_PATH).
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: redis-ca
              mountPath: /etc/redis-ca
              readOnly: true
          ports:
            - containerPort: 9090
              name: grpc
            - containerPort: 8081
              name: mgmt
          envFrom:
            - configMapRef:
                name: message-service-config
            - secretRef:
                name: postgres-credentials
          env:
            # Cloud SQL private IP, see the wait-for-postgres init container.
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: cloudsql-connection
                  key: privateIP
            # Memorystore private IP (redis-connection: host) + AUTH string (redis-connection-auth:
            # attribute.auth_string, written by the provider), see the wait-for-redis init container.
            # REDIS_PORT / REDIS_TLS / REDIS_CA_CERT_PATH come from the ConfigMap.
            - name: REDIS_HOST
              valueFrom:
                secretKeyRef:
                  name: redis-connection
                  key: host
            - name: REDIS_AUTH_STRING
              valueFrom:
                secretKeyRef:
                  name: redis-connection-auth
                  key: attribute.auth_string
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          # A native Rust binary: no heap to size and no JIT warm-up. Requests == limits for memory
          # so the pod is never OOM-killed for using what it was promised; the CPU limit leaves
          # headroom for bursts.
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "128Mi"
          # Startup: the gRPC health service (grpc.health.v1, port 9090) answers once the server is
          # listening. Budget: 2s + 12 x 2s = 26s (database + cache connections included).
          # Liveness/readiness: plain HTTP on the management port - /livez is process-up, /readyz
          # also checks the database and cache and goes DOWN on SIGTERM.
          startupProbe:
            grpc:
              port: 9090
            initialDelaySeconds: 2
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /livez
              port: mgmt
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: mgmt
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          # Shutdown: the pod leaves the Service endpoints as soon as it is Terminating, but the
          # load balancer takes a few seconds to notice. The sleep keeps serving during that window;
          # then SIGTERM flips readiness DOWN and the gRPC server drains in-flight calls
          # (graceful shutdown). 10s sleep + drain < the 45s terminationGracePeriodSeconds.
          lifecycle:
            preStop:
              sleep:
                seconds: 10
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
        - name: redis-ca
          secret:
            secretName: redis-connection
            items:
              # Composed Secret key -> a plain ca.crt file.
              - key: ca.crt
                path: ca.crt
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - message-service
                topologyKey: "kubernetes.io/hostname"
