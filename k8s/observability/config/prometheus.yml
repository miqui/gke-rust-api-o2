global:
  scrape_interval: 15s

# Replicates the message-service metrics (job "message-service" below - the Rust API's own
# /metrics endpoint on the management port; job "otel-collector" carries whatever the API
# pushes via OTLP) plus
# cluster ops metrics (node-exporter, kube-state-metrics - the same jobs behind
# the "Cluster ops" Grafana dashboard) into OpenObserve (see
# k8s/observability/openobserve-values.yaml), which exposes a Prometheus
# remote_write-compatible ingestion endpoint. username_file/password_file are mounted from
# the openobserve-remote-write-credentials Secret (External Secrets, see
# externalsecrets.yaml and prometheus-deployment.yaml) so the credentials never have to
# live in this ConfigMap.
#
# write_relabel_configs keeps only these jobs: an earlier attempt at forwarding every
# scraped job (in particular kubernetes-nodes-cadvisor's per-container series) was
# high-cardinality enough to overflow OpenObserve's single-node in-memory MemTable -
# confirmed live: every write request failed with HTTP 400
# {"code":400,"message":"Error# MemoryTableOverflowError"} until this relabeling was
# added. node-exporter/kube-state-metrics are being added back in deliberately, one
# step at a time, verifying no overflow before adding kubernetes-nodes-cadvisor (by
# far the highest-cardinality job) on top - see openobserve-values.yaml's resources,
# bumped in the same step, and its 3-day ZO_COMPACT_DATA_RETENTION_DAYS (OpenObserve's
# PVC is a fixed 5Gi persistent disk; unbounded retention on wider data would fill it).
remote_write:
  - url: http://openobserve.observability.svc.cluster.local:5080/api/default/prometheus/api/v1/write
    basic_auth:
      username_file: /etc/prometheus/openobserve-auth/username
      password_file: /etc/prometheus/openobserve-auth/password
    write_relabel_configs:
      - source_labels: [job]
        regex: 'otel-collector|message-service|node-exporter|kube-state-metrics|kubernetes-nodes-cadvisor'
        action: keep

scrape_configs:
  - job_name: 'otel-collector'
    static_configs:
      - targets: ['otel-collector.observability.svc.cluster.local:8889']

  - job_name: 'kube-state-metrics'
    static_configs:
      - targets: ['kube-state-metrics.observability.svc.cluster.local:8080']

  # OpenObserve's own self-monitoring metrics (config.ZO_PROMETHEUS_ENABLED in
  # k8s/observability/openobserve-values.yaml - off by default, confirmed live: with it
  # off, /metrics returns HTTP 200 with an empty body). Feeds the "OpenObserve Ops"
  # Grafana dashboard only - not remote_written back into OpenObserve itself.
  - job_name: 'openobserve'
    static_configs:
      - targets: ['openobserve.observability.svc.cluster.local:5080']

  # Postgres is Cloud SQL (k8s/postgres.yaml); postgres-exporter is a Deployment in the
  # default namespace connecting to it over its private IP.
  - job_name: 'postgres-exporter'
    static_configs:
      - targets: ['postgres-exporter.default.svc.cluster.local:9187']

  # message-service pods: Prometheus metrics on the management port (:8081/metrics). Pods are
  # discovered through the API (they change IPs and scale with the HPA); the network policy in
  # k8s/networkpolicies.yaml allows exactly this flow.
  - job_name: 'message-service'
    metrics_path: /metrics
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          names: ['default']
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_label_app]
        regex: message-service
        action: keep
      - source_labels: [__meta_kubernetes_pod_container_port_name]
        regex: mgmt
        action: keep
      - source_labels: [__meta_kubernetes_pod_name]
        target_label: pod
      # The Grafana gRPC/RED dashboards select on service_name="message-service" (the label the
      # OTLP pipeline used to add). The Rust app's own /metrics has no such label, so add it here.
      - target_label: service_name
        replacement: message-service

  # Trivy Operator (k8s/argocd/apps/trivy-operator.yaml): per-workload counts of
  # vulnerabilities, config-audit/RBAC/infra findings, exposed secrets and compliance status.
  # Feeds the "Trivy Security" Grafana dashboard only - deliberately not in the remote_write
  # keep list above (the counts change only when a scan finishes, and OpenObserve's MemTable
  # headroom is reserved for the ops jobs). The chart's Service is headless (clusterIP: None),
  # so its name resolves straight to the operator pod and its port-80 -> targetPort mapping
  # never applies: scrape the container's own metrics port, 8080.
  - job_name: 'trivy-operator'
    static_configs:
      - targets: ['trivy-operator.trivy-system.svc.cluster.local:8080']

  # node-exporter runs hostNetwork, so its pod IP == the node's IP; scraped directly
  - job_name: 'node-exporter'
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          names: ['observability']
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_label_app]
        regex: node-exporter
        action: keep
      - source_labels: [__meta_kubernetes_pod_node_name]
        target_label: node
      - source_labels: [__address__]
        regex: '(.+):\d+'
        target_label: __address__
        replacement: '${1}:9100'

  # Per-container resource usage (CPU/memory), scraped via the API server's proxy to each
  # kubelet's cAdvisor endpoint - avoids needing direct network access to kubelet's port 10250.
  - job_name: 'kubernetes-nodes-cadvisor'
    scheme: https
    tls_config:
      ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
      insecure_skip_verify: true
    bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
    kubernetes_sd_configs:
      - role: node
    relabel_configs:
      - action: labelmap
        regex: __meta_kubernetes_node_label_(.+)
      - target_label: __address__
        replacement: kubernetes.default.svc:443
      - source_labels: [__meta_kubernetes_node_name]
        target_label: __metrics_path__
        replacement: /api/v1/nodes/${1}/proxy/metrics/cadvisor
