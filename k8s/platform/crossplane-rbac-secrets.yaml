# Lets Crossplane's composition controller create the plain v1 Secret the RedisInstance Composition
# composes (the `endpoint` resource in redis-composition.yaml: host, port, ca.crt). Crossplane v2
# only manages composed resource kinds its ClusterRole grants; the rbac-manager aggregates every
# ClusterRole carrying this label into it. Harmless if the base role already covers secrets.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: crossplane-composed-secrets
  labels:
    rbac.crossplane.io/aggregate-to-crossplane: "true"
  annotations:
    argocd.argoproj.io/sync-wave: "0"
rules:
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get, list, watch, create, update, patch, delete]
