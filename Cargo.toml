[package]
name = "message-service"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Message/Author gRPC service (tonic) - Rust port of the Spring Boot message-service"
license = "MIT"
publish = false

[lib]
name = "message_service"
path = "src/lib.rs"

[[bin]]
name = "message-service"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
chrono = "0.4.45"
futures-util = "0.3.34"
opentelemetry = "0.33.1"
opentelemetry-otlp = { version = "0.33.1", default-features = false, features = ["trace", "http-proto", "reqwest-blocking-client", "reqwest-rustls"] }
opentelemetry_sdk = { version = "0.33.1", features = ["trace"] }
prometheus = "0.14.0"
prost = "0.14.4"
prost-types = "0.14.4"
redis = { version = "1.2.2", default-features = false, features = ["tokio-comp", "tokio-rustls-comp", "connection-manager", "tls-rustls", "tls-rustls-webpki-roots", "script"] }
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "tls-rustls-ring-webpki", "postgres", "uuid", "chrono"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "signal", "time", "net"] }
tokio-stream = { version = "0.1.19", features = ["net"] }
tonic = "0.14.5"
tonic-health = "0.14.5"
tonic-prost = "0.14.5"
tonic-reflection = "0.14.5"
tonic-types = "0.14.5"
tracing = "0.1.44"
tracing-opentelemetry = "0.34.0"
tracing-subscriber = { version = "0.3.23", features = ["json", "env-filter"] }
uuid = { version = "1.26.1", features = ["v4"] }

[build-dependencies]
protoc-bin-vendored = "3.3.0"
tonic-prost-build = "0.14.5"

[dev-dependencies]
futures = "0.3.34"
testcontainers = "0.25.0"
testcontainers-modules = { version = "0.13.0", features = ["postgres", "redis"] }
tokio = { version = "1.54.1", features = ["full"] }
url = "2.5.8"
