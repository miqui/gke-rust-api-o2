# Local dependencies for `cargo run` (the defaults in src/config.rs match; set REDIS_HOST=localhost to use the cache):
#
#   docker compose up -d                      Postgres 16 + Redis 7 (Memorystore is Redis on GKE)
#   docker compose --profile otel up -d       + an OTel Collector exposing what the app pushes
#                                             as Prometheus metrics on http://localhost:8889/metrics
#                                             (the same exporter config as the cluster's collector)
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: message_app
      POSTGRES_PASSWORD: message_app
      POSTGRES_DB: messagedb
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "message_app"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  otel-collector:
    profiles: [otel]
    image: otel/opentelemetry-collector-contrib:0.114.0
    command: ["--config=/etc/otelcol/config.yaml"]
    configs:
      - source: otel-collector
        target: /etc/otelcol/config.yaml
    ports:
      - "4318:4318"
      - "8889:8889"

configs:
  otel-collector:
    content: |
      receivers:
        otlp:
          protocols:
            http:
              endpoint: 0.0.0.0:4318
      processors:
        batch: {}
      exporters:
        prometheus:
          endpoint: 0.0.0.0:8889
          resource_to_telemetry_conversion:
            enabled: true
        debug:
          verbosity: normal
      service:
        pipelines:
          metrics:
            receivers: [otlp]
            processors: [batch]
            exporters: [prometheus]
          traces:
            receivers: [otlp]
            processors: [batch]
            exporters: [debug]
